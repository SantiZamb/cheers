<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; max-width: 440px; margin: 0 auto; padding: 32px 24px; color: #111113;">
  <div style="font-size: 40px; line-height: 1;">🍻</div>
  <h1 style="font-size: 24px; margin: 16px 0 8px;">Reset your Cheers password</h1>
  <p style="font-size: 16px; line-height: 1.5; color: #6E6D73; margin: 0 0 24px;">
    Enter this code in the app, then choose a new password.
  </p>
  <div style="font-size: 34px; font-weight: 800; letter-spacing: 8px; background: #FFF0DC; color: #FF5E1A; border-radius: 18px; padding: 20px; text-align: center;">
    {{ .Token }}
  </div>
  <p style="font-size: 14px; line-height: 1.5; color: #6E6D73; margin: 24px 0 0;">
    The code expires in an hour. If you didn’t ask to reset your password, you can ignore this email; your password stays the same.
  </p>
</div>
